name: lint

on:
  pull_request:
    branches:
      - main

jobs:
  fmt:
    name: Check format with fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v4
        with:
         token: ${{ secrets.GITHUB_TOKEN }}
         version: latest
         args: --check .